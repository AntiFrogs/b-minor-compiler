<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B-Minor source</title>
<style>
  body { margin: 0; background: #111827; color: #f1f5f9; }
  pre {
    margin: 0;
    padding: 1.25rem;
    overflow-x: auto;
    white-space: pre;
    tab-size: 4;
    font: 0.9375rem/1.6 ui-monospace, monospace;
  }
  code { font: inherit; }
  .kw { color: #82aaff; font-weight: bold; }
  .type { color: #67e8f9; }
  .fn { color: #f5cf75; }
  .lit { color: #f9a76a; }
  .str { color: #ace39c; }
  .op { color: #cbd5e1; }
  .comment { color: #a6afbd; font-style: italic; }
  .error { color: #fda4af; text-decoration: underline; }
</style>
</head>
<body>
<pre><code><span class="comment">/* Render &lt;tag&gt; &amp; keep &quot;quotes&quot;. */</span>
<span class="fn">double_value</span>: <span class="kw">function</span> <span class="type">integer</span> (value: <span class="type">integer</span>) <span class="op">=</span> {
    <span class="kw">return</span> value <span class="op">*</span> <span class="lit">2</span>;
}

<span class="fn">main</span>: <span class="kw">function</span> <span class="type">integer</span> () <span class="op">=</span> {
    value: <span class="type">integer</span> <span class="op">=</span> <span class="lit">3</span>;
    <span class="kw">print</span> <span class="str">&quot;&lt;tag&gt;&amp;&quot;</span>, <span class="fn">double_value</span>(value), <span class="str">&#39;\n&#39;</span>;
    <span class="kw">return</span> <span class="lit">0</span>;
}
</code></pre>
</body>
